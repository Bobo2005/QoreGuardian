[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
qorechain_testnet = "https://evm-testnet.qore.host"
qorechain_diana = "https://evm-testnet.qore.host"
local = "http://127.0.0.1:8545"

[etherscan]
qorechain_diana = { key = "${EXPLORER_API_KEY}", url = "https://explore.qore.network/api", chain = 9800 }
